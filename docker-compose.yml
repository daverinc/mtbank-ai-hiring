services:
  # === FastAPI (основное приложение) ===
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mtbank_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./models:/app/models
      - ./api:/app/api
      - ./test_data:/app/test_data
      - ./test_results:/app/test_results
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434/v1
    depends_on:
      - ollama
    restart: unless-stopped

  pipelines:
    image: ghcr.io/open-webui/pipelines:main
    container_name: pipelines
    ports:
      - "9099:9099"
    volumes:
      - ./pipelines:/app/pipelines
      - /var/lib/docker/volumes/mtbank-ai-hiring_openwebui/_data:/app/openwebui_data:ro
    env_file:
      - .env
    environment:
      - OPENWEBUI_API_KEY=${OPENWEBUI_API_KEY}
      - PIPELINES_DIR=/app/pipelines
    restart: unless-stopped

  # === OpenWebUI ===
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    ports:
      - "9090:8080"
    volumes:
      - openwebui:/app/backend/data
    env_file:
      - .env
    environment:
      - ENABLE_PIPES=true
    depends_on:
      - ollama
    restart: unless-stopped

  # === Ollama ===
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_local
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  openwebui:
  ollama_data: