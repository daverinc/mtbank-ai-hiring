# pytest.ini
[pytest]
asyncio_mode = auto
testpaths = tests

# Все опции в одной строке
addopts = -v --tb=short --cov=. --cov-report=term-missing --cov-report=html:htmlcov --cov-fail-under=70

# Игнорируем предупреждения
filterwarnings =
    ignore::DeprecationWarning:starlette
    ignore::DeprecationWarning:httpx

[coverage:run]
branch = True
source = .

omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */.venv/*
    */migrations/*
    */htmlcov/*
    setup.py
    conftest.py
    */__init__.py

[coverage:report]
precision = 2
show_missing = True
skip_empty = True
fail_under = 70

exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    pass
    ...